
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuval's Maze</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f3f3f3; }
        .maze { display: grid; grid-template-columns: repeat(5, 50px); grid-gap: 2px; }
        .cell { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .wall { background-color: #555; }
        .path { background-color: #eee; }
        .start { background-color: green; }
        .goal { background-color: gold; }
        .gate { background-color: red; }
        .message { font-size: 20px; font-weight: bold; color: green; }
        #hint { font-size: 14px; color: red; }
        #output { margin-top: 20px; }
        #game-container { text-align: center; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Shuval's Maze Game</h1>
        <div class="maze" id="maze"></div>
        <div id="hint"></div>
        <p id="output"></p>
        <h2>Instructions</h2>
        <p>To escape, write JavaScript code below that moves the fox to the goal and unlocks the gate.</p>
        <h3>Write your solution below (in JavaScript):</h3>
        <textarea id="codeInput" rows="4" cols="50"></textarea><br>
        <button onclick="solveMaze()">Solve the Maze</button>
    </div>

    <script>
        const maze = [
            [0, 0, 0, 1, 0],
            [0, 1, 0, 1, 0],
            [0, 1, 0, 1, 0],
            [0, 1, 0, 0, 0],
            [2, 0, 0, 0, 3],
        ];
        
        const startPosition = { x: 0, y: 0 };
        const goalPosition = { x: 4, y: 4 };
        const gatePosition = { x: 3, y: 4 };
        let currentPosition = { ...startPosition };
        let gateUnlocked = false;
        
        function drawMaze() {
            const mazeElement = document.getElementById('maze');
            mazeElement.innerHTML = '';
            for (let row = 0; row < maze.length; row++) {
                for (let col = 0; col < maze[row].length; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    if (maze[row][col] === 1) {
                        cell.classList.add('wall');
                    } else if (row === startPosition.x && col === startPosition.y) {
                        cell.classList.add('start');
                        cell.innerText = 'Start';
                    } else if (row === goalPosition.x && col === goalPosition.y) {
                        cell.classList.add('goal');
                        cell.innerText = 'Goal';
                    } else if (row === gatePosition.x && col === gatePosition.y) {
                        cell.classList.add('gate');
                        if (gateUnlocked) {
                            cell.innerText = 'Unlocked';
                        } else {
                            cell.innerText = 'Locked';
                        }
                    } else {
                        cell.classList.add('path');
                    }
                    mazeElement.appendChild(cell);
                }
            }
        }
        
        function solveMaze() {
            try {
                const code = document.getElementById('codeInput').value;
                eval(code); // Evaluating the user's JavaScript code
                
                if (currentPosition.x === goalPosition.x && currentPosition.y === goalPosition.y) {
                    document.getElementById('output').innerHTML = '<span class="message">Congratulations! You solved the maze and found the kittens!</span>';
                    document.getElementById('hint').innerText = '';
                    document.getElementById('maze').innerHTML += `<img src="https://example.com/cats_hugging.jpg" alt="Cute Kittens" style="width: 200px; margin-top: 20px;">`;
                } else if (currentPosition.x === gatePosition.x && currentPosition.y === gatePosition.y && gateUnlocked) {
                    document.getElementById('output').innerHTML = '<span class="message">The gate is unlocked! Now go to the goal!</span>';
                }
                
            } catch (e) {
                document.getElementById('output').innerHTML = '<span style="color: red;">Error: Please check your code!</span>';
            }
        }
        
        function move(direction) {
            if (direction === "right" && currentPosition.y < 4 && maze[currentPosition.x][currentPosition.y + 1] !== 1) {
                currentPosition.y++;
            } else if (direction === "left" && currentPosition.y > 0 && maze[currentPosition.x][currentPosition.y - 1] !== 1) {
                currentPosition.y--;
            } else if (direction === "down" && currentPosition.x < 4 && maze[currentPosition.x + 1][currentPosition.y] !== 1) {
                currentPosition.x++;
            } else if (direction === "up" && currentPosition.x > 0 && maze[currentPosition.x - 1][currentPosition.y] !== 1) {
                currentPosition.x--;
            }
            drawMaze();
        }
        
        function unlockGate() {
            gateUnlocked = true;
            drawMaze();
        }
        
        drawMaze();
    </script>
</body>
</html>
